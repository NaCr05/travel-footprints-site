<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d1e20">
  <meta name="description" content="一张慢慢填满的世界地图。记录去过的城市、到访月份和旅途中的记忆。">
  <title>旅行足迹 · 走过的地方</title>
  <link rel="icon" href="./site/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="./site/styles.css">
  <script src="./vendor/d3.min.js" defer></script>
  <script type="module" src="./site/app.js"></script>
</head>
<body data-theme="dark" class="panel-collapsed">
  <a class="skip-link" href="#panel">跳到城市列表</a>
  <main id="map" aria-label="旅行足迹交互地图"></main>
  <div class="loading" id="loading" role="status"><img src="./site/mark.svg" width="38" height="38" alt=""><span>正在展开世界地图…</span></div>
  <header class="page-header">
    <div><h1><button class="brand" id="home" aria-label="返回全部足迹">Places I’ve Visited</button></h1><p id="atlas-summary">旅行足迹</p></div>
    <nav class="topbar" aria-label="主要导航">
    <button class="nav-item active" data-view="places" aria-pressed="true">城市</button>
    <button class="nav-item" data-view="timeline" aria-pressed="false">时间线</button>
    <button class="nav-item" data-view="stats" aria-pressed="false">概览</button>
    <button class="icon-button theme" id="theme" aria-label="切换到浅色模式" title="切换配色"></button>
  </nav>
  </header>
  <aside class="panel glass is-collapsed" id="panel" tabindex="-1" aria-label="城市与旅行记录" aria-hidden="true" inert>
    <div class="panel-top">
      <div class="heading-row"><h2 id="panel-title">走过的地方</h2><button class="collapse-button" id="collapse" aria-label="收起侧栏" aria-controls="panel" aria-expanded="false"></button></div>
      <p class="subtitle" id="summary">每一个点，都是一段记忆。</p>
      <div class="filters" id="filters">
        <label class="search"><span id="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="找一座城市…" aria-label="搜索城市、国家或地区" autocomplete="off"><kbd>/</kbd></label>
        <div class="filter-row">
          <label class="sr-only" for="country">国家</label><select id="country"><option value="all">所有国家</option></select>
          <label class="sr-only" for="year">到访年份</label><select id="year"><option value="all">所有年份</option></select>
          <button class="icon-button reset-filter" id="clear-filters" aria-label="清除筛选" title="清除筛选" hidden></button>
        </div>
      </div>
    </div>
    <div class="panel-content" id="content"></div>
    <div class="panel-footer"><span id="result-count" aria-live="polite"></span><button id="fit-results">在地图上查看 <span aria-hidden="true">↗</span></button></div>
  </aside>
  <button id="show-panel" class="glass reopen" aria-label="展开侧栏" aria-controls="panel" aria-expanded="false"><span aria-hidden="true">☰</span> 城市列表</button>
  <div class="map-controls" aria-label="地图操作"><button class="icon-button glass" id="zoom-in" aria-label="放大地图" title="放大">+</button><button class="icon-button glass" id="zoom-out" aria-label="缩小地图" title="缩小">−</button><button class="icon-button glass" id="reset-view" aria-label="回到世界全图" title="世界全图"></button></div>
  <div class="map-help">拖动 · 缩放 · 悬浮查看城市</div>
  <div class="attribution"><a href="https://maplibre.org/" target="_blank" rel="noopener noreferrer">MapLibre</a> · <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a> · <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a></div>
  <dialog id="photo-viewer" aria-label="城市照片"><button class="icon-button" id="close-photo" aria-label="关闭照片">×</button><img id="full-photo" alt=""><p id="photo-caption"></p></dialog>
  <noscript><div class="loading">请启用 JavaScript 以使用交互地图。也可以打开 assets/travel-map.svg 查看静态地图。</div></noscript>
</body>
</html>
